name: Verify public evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify manifests and receipts
        run: python evidence/verify.py
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
